<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripWise | Smart Travel Planner</title>
    <meta name="description" content="TripWise compares flights, ranks stays by transparent index, and schedules day-by-day itineraries with traffic-aware timings." />
    <meta property="og:title" content="TripWise - Smart Multi-Provider Travel Planner" />
    <meta property="og:description" content="Compare verified fares, transparent hotel rankings, and intelligent drag-and-drop itineraries." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#713600" />

    <!-- Inline script to prevent flash of unstyled theme on page load -->
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('tripwise-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark) || (storedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-brand-orange selection:text-brand-cream min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
